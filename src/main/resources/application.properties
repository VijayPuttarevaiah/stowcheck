spring.application.name=stowcheck

# Local default: in-memory H2 so the app runs with no setup.
# docker-compose overrides these to use PostgreSQL.
spring.datasource.url=jdbc:h2:mem:stowcheck;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upper bound for any container's gross mass; set per terminal or crane limit.
stowcheck.rules.max-gross-kg=36000

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=stowcheck
management.metrics.distribution.percentiles-histogram.stowcheck.validation.duration=true

# Optional AI review of findings via Groq. Off unless GROQ_API_KEY is set.
stowcheck.ai.api-key=${GROQ_API_KEY:}
stowcheck.ai.model=openai/gpt-oss-120b
stowcheck.ai.base-url=https://api.groq.com/openai/v1
stowcheck.ai.max-findings=40
